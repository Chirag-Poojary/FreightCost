services:
  - type: web
    name: freightcost-api
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Invoice extraction -- set at least one. Gemini is the recommended primary.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        sync: false
      # Optional: Qwen3-VL-4B self-hosted on a cloud GPU (vLLM/TGI/Ollama, OpenAI-compatible URL)
      - key: CLOUD_VLM_URL
        sync: false
      - key: CLOUD_VLM_MODEL
        sync: false
      - key: CLOUD_VLM_API_KEY
        sync: false
      - key: ORS_API_KEY
        sync: false
